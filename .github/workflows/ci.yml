name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn python-dotenv pydantic

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short || echo "Some tests require full dependencies (chromadb, sentence-transformers) and may be skipped in CI"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/
            evaluation/results/
